<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/temper

    <Directory /var/www/temper>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        # Keep post_max_size above upload_max_filesize so 10–20 MB attachments work.
        php_value upload_max_filesize 20M
        php_value post_max_size 32M

    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/treasurer_error.log
    CustomLog ${APACHE_LOG_DIR}/treasurer_access.log combined
</VirtualHost>
