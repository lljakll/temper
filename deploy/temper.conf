<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/temper

    <Directory /var/www/temper>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        # Raised for backup-package restore (DB dump + attachments).
        # Ledger attachment size remains capped at 20 MB in application code.
        php_value upload_max_filesize 128M
        php_value post_max_size 160M

    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/treasurer_error.log
    CustomLog ${APACHE_LOG_DIR}/treasurer_access.log combined
</VirtualHost>
