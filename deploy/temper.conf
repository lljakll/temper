<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/temper

    <Directory /var/www/temper>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/treasurer_error.log
    CustomLog ${APACHE_LOG_DIR}/treasurer_access.log combined
</VirtualHost>
