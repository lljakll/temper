# Temper Workflow Definition — minimal skeleton (v1)
# Spec: guided multipage UI, sequential steps, events-based engine.
# Author externally, then import via Admin → Workflow Definitions or:
#   php scripts/workflow-import.php storage/workflow-definitions/examples/minimal.example.yaml
#
# Immutable storage after import: storage/workflow-definitions/{id}.v{version}.yaml
# Ledger attachments (final record): storage/attachments/{ledger sequence number}/
#
# Do not put accounting policy / Treasurer's Guide rules here beyond process steps.

id: example_minimal
title: "Example Minimal Workflow"
description: "Skeleton showing page grouping and sequential steps for the engine."
version: 1
spec_version: 1

# Who may start / execute this workflow (permission keys and/or role names).
# Definition import/delete is always Admin or Workflow Manager only.
permissions:
  execute:
    - workflow.view
    - Treasurer
    - Teller

ui:
  style: guided_multipage   # primary model; single_page reserved for later
  include_review: true

# Logical pages for the guided multipage UI (definition-driven grouping).
pages:
  - key: basics
    title: "Basic information"
    groups:
      - key: header
        title: "Header"
        fields:
          - name: service_date
            type: date
            label: "Service date"
            required: true
          - name: description
            type: text
            label: "Description"
            required: true

  - key: details
    title: "Details"
    groups:
      - key: amounts
        title: "Amounts"
        fields:
          - name: amount
            type: currency
            label: "Amount"
            required: true
          - name: notes
            type: textarea
            label: "Notes"
            required: false

  - key: review
    title: "Review & confirm"
    groups: []

# Sequential steps (v1). Each step may reference a page and optional role/permission.
steps:
  - key: enter_basics
    title: "Enter basics"
    page: basics
    role: Teller
    permission: workflow.view
    actions:
      - type: log_event
    validations:
      - field: service_date
        rule: required

  - key: enter_details
    title: "Enter details"
    page: details
    role: Teller
    actions:
      - type: validate_totals

  - key: review_and_finish
    title: "Review"
    page: review
    role: Treasurer
    actions:
      - type: require_signature
      # Future ledger hooks (stubs in engine dictionary):
      # - type: create_ledger_entry
      # - type: finalize_ledger
      # - type: attach_document

# Actions when the last step completes (hooks for ledger integration).
on_complete:
  - type: set_status
  - type: log_event
  # - type: create_ledger_entry
  # - type: finalize_ledger
